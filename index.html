<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="assets/calc.png">
</head>
<body>
    <div id="calculator">
        <div id="display">
            <input type="text" id="result" readonly>
        </div>
        <div id="buttons">
            <button id="clear" class="buttons">AC</button>   
            <button id="del" class="buttons">DEL</button>
            <button id="devider" class="buttons">/</button>
            <button id="multiplier" class="buttons">X</button>
            <button id="seven" class="buttons">7</button>
            <button id="eight" class="buttons">8</button>
            <button id="nine" class="buttons">9</button>
            <button id="minus" class="buttons">-</button>
            <button id="four" class="buttons">4</button>
            <button id="five" class="buttons">5</button>
            <button id="six" class="buttons">6</button>
            <button id="plus" class="buttons">+</button>
            <button id="one" class="buttons">1</button>
            <button id="two" class="buttons">2</button>
            <button id="three" class="buttons">3</button>
            <button id="equal" class="buttons">=</button>
            <button id="zero" class="buttons">0</button>
            <button id="decimal-point" class="buttons">.</button>
        </div>
    </div>
   <script src="javascript/script.js"></script> 
</body>
</html>
